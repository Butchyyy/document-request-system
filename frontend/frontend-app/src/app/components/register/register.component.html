<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-10">
  <div class="bg-white border border-gray-200 rounded-2xl w-full max-w-md p-8 shadow-sm">

    <div class="flex items-center gap-2 mb-6">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="text-base font-medium text-gray-800">DocRequest</span>
    </div>

    <h1 class="text-lg font-medium text-gray-900 mb-1">Create an account</h1>
    <p class="text-sm text-gray-500 mb-6">Register to start requesting documents.</p>

    <div *ngIf="errorMessage"
      class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-5 text-sm">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Role toggle -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Register as</label>
        <div class="grid grid-cols-2 gap-1 p-1 bg-gray-100 rounded-lg">
          <button type="button" (click)="setRole('user')"
            [class]="selectedRole === 'user'
              ? 'py-2 rounded-md text-sm font-medium bg-white text-blue-600 shadow-sm transition'
              : 'py-2 rounded-md text-sm text-gray-500 hover:text-gray-700 transition'">
            User
          </button>
          <button type="button" (click)="setRole('admin')"
            [class]="selectedRole === 'admin'
              ? 'py-2 rounded-md text-sm font-medium bg-white text-purple-600 shadow-sm transition'
              : 'py-2 rounded-md text-sm text-gray-500 hover:text-gray-700 transition'">
            Admin
          </button>
        </div>
      </div>

      <!-- Full Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Full name</label>
        <input formControlName="name" type="text" placeholder="Juan dela Cruz"
          class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
        <p *ngIf="form.get('name')?.touched && form.get('name')?.invalid"
          class="text-red-500 text-xs mt-1">Name is required.</p>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <input formControlName="email" type="email" placeholder="you@email.com"
          class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
        <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
          class="text-red-500 text-xs mt-1">Valid email required.</p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <input formControlName="password" type="password" placeholder="Min. 6 characters"
          class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
        <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
          class="text-red-500 text-xs mt-1">Min. 6 characters required.</p>
      </div>

      <!-- Admin secret -->
      <div *ngIf="selectedRole === 'admin'" class="bg-purple-50 border border-purple-200 rounded-lg p-4">
        <label class="block text-sm font-medium text-purple-700 mb-1.5">Admin registration key</label>
        <input formControlName="adminSecret" type="password" placeholder="Enter admin secret key"
          class="w-full border border-purple-300 bg-white rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" />
        <p class="text-purple-500 text-xs mt-1.5">Contact your system administrator for this key.</p>
        <p *ngIf="form.get('adminSecret')?.touched && form.get('adminSecret')?.invalid"
          class="text-red-500 text-xs mt-1">Secret key is required for admin registration.</p>
      </div>

      <button type="submit" [disabled]="isLoading"
        [class]="selectedRole === 'admin'
          ? 'w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium rounded-lg py-2.5 text-sm transition mt-2'
          : 'w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium rounded-lg py-2.5 text-sm transition mt-2'">
        {{ isLoading ? 'Creating account...' : (selectedRole === 'admin' ? 'Register as Admin' : 'Create Account') }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Already have an account?
      <a routerLink="/login" class="text-blue-600 hover:underline font-medium">Sign in</a>
    </p>
  </div>
</div>
