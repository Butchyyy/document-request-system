<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="bg-white border border-gray-200 rounded-2xl w-full max-w-md p-8 shadow-sm">

    <div class="flex items-center gap-2 mb-6">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="text-base font-medium text-gray-800">DocRequest</span>
    </div>

    <h1 class="text-lg font-medium text-gray-900 mb-1">Sign in</h1>
    <p class="text-sm text-gray-500 mb-6">Welcome back — enter your credentials to continue.</p>

    <div *ngIf="errorMessage"
      class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-5 text-sm">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <input formControlName="email" type="email" placeholder="you@email.com"
          class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
        <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
          class="text-red-500 text-xs mt-1">Valid email required.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <input formControlName="password" type="password" placeholder="••••••••"
          class="w-full border border-gray-300 rounded-lg px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
        <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
          class="text-red-500 text-xs mt-1">Password required.</p>
      </div>

      <button type="submit" [disabled]="isLoading"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium rounded-lg py-2.5 text-sm transition mt-2">
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Don't have an account?
      <a routerLink="/register" class="text-blue-600 hover:underline font-medium">Register</a>
    </p>
  </div>
</div>
